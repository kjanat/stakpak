[package]
name = "stakpak-api"
version = { workspace = true }
edition = "2024"
description = "API client library for Stakpak Agent with Anthropic Claude Code and OpenAI support"
license = "Apache-2.0"
repository = "https://github.com/kjanat/stakpak"
readme = "../../README.md"
keywords = ["api", "anthropic", "claude", "openai", "client"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
stakpak-shared = { path = "../../libs/shared" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
eventsource-stream = "0.2.3"
url = "2.5.0"
urlencoding = "2.1"
