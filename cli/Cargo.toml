[package]
name = "stakpak"
version = { workspace = true }
edition = "2024"
description = "Security-hardened AI agent for DevOps and operations with mTLS encryption and privacy features"
readme = "../README.md"
repository = "https://github.com/kjanat/stakpak"
license = "Apache-2.0"
keywords = ["ai-agent", "automation", "devops", "mtls", "security"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# ACP dependencies
agent-client-protocol = "0.4.7"
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5.23", features = ["derive", "env"] }
config = "0.14.1"
crossterm = { workspace = true }
flate2 = "1.1"
futures-util = { workspace = true }
glob = "0.3"
jsonrpc-core = "18.0.0"
jsonrpc-derive = "18.0.0"
log = "0.4"
names = "0.14.0"
open = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
rpassword = "7.3"
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = { workspace = true }
stakpak-api = { path = "../libs/api" }
stakpak-mcp-client = { path = "../libs/mcp/client" }
stakpak-mcp-server = { path = "../libs/mcp/server" }
stakpak-shared = { path = "../libs/shared" }
stakpak-tui = { path = "../tui" }
tar = "0.4"
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8.19"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
urlencoding = "2.1"
uuid = { workspace = true }
walkdir = { workspace = true }
zip = "4.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
